<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Калькулятор</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ecf1;--panel:#fff;--ink:#161a23;--mute:#7b8496;--key:#f1f3f7;--acc:#2f4bff;--accink:#fff;--tp:#e6eaff;--line:#dfe3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--panel:#171a22;--ink:#eef0f5;--mute:#8890a3;--key:#232833;--acc:#7b8fff;--accink:#0e1015;--tp:#252c57;--line:#2a2f3b}}
:root[data-theme="dark"]{--bg:#0e1015;--panel:#171a22;--ink:#eef0f5;--mute:#8890a3;--key:#232833;--acc:#7b8fff;--accink:#0e1015;--tp:#252c57;--line:#2a2f3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 18px/1.2 Onest,system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:440px;height:100%;max-height:840px;background:var(--panel);display:flex;flex-direction:column;padding:14px;gap:10px;position:relative;overflow:hidden}
@media(min-width:480px){.app{border-radius:28px;height:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}}
.top{display:flex;justify-content:space-between}
.top button{background:none;border:0;color:var(--mute);font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;cursor:pointer}
.disp{flex:1;min-height:140px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:0 6px;gap:6px;overflow:hidden}
.expr{font-size:36px;line-height:1.5;text-align:right;max-height:130px;overflow:auto;width:100%;word-break:break-all}
.cur{display:inline-block;width:2px;height:1em;background:var(--acc);vertical-align:middle;margin:0 1px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.slot{display:inline-block;min-width:.75em;height:.85em;border:1.5px dashed var(--acc);border-radius:4px;vertical-align:middle;text-align:center;line-height:.8;opacity:.55}
.slot.on{opacity:1;background:var(--tp)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.85em;line-height:1.35;margin:0 3px}
.fr .de{border-top:2px solid var(--ink);padding-top:2px;min-width:100%;text-align:center}
sup{font-size:.6em;vertical-align:.7em;line-height:0}
.rad .ri{border-top:2px solid var(--ink);padding:0 2px;margin-left:1px}
.res{font-size:24px;color:var(--mute);min-height:30px}
.res.final{color:var(--ink);font-size:42px;font-weight:600}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.nav button{height:38px;border:0;border-radius:12px;background:var(--key);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.tabs{display:flex;background:var(--key);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:9px 0;border-radius:11px;cursor:pointer}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tools button{height:42px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:12px;font:inherit;font-size:15px;cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pad button{height:58px;border:0;border-radius:16px;background:var(--key);color:var(--ink);font:inherit;font-size:26px;cursor:pointer;transition:transform .08s;display:flex;align-items:center;justify-content:center;gap:1px}
.pad button:active,.tools button:active,.nav button:active{transform:scale(.94)}
.pad .t{background:var(--tp);color:var(--ink)}
.pad .o{background:var(--key);color:var(--acc)}
.pad .eq{background:var(--acc);color:var(--accink)}
.pad .n{background:var(--panel);border:1px solid var(--line)}
.b{display:inline-block;width:13px;height:13px;border:1.5px dashed var(--acc);border-radius:3px}
.g .fr{font-size:.6em;margin:0}.g .fr .b{width:11px;height:10px}.g .fr u{width:24px;height:2px;background:var(--ink);margin:2px 0}
.g sup .b{width:8px;height:8px}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hist{position:absolute;inset:0;background:var(--panel);padding:14px;display:none;flex-direction:column;gap:8px;overflow:auto;z-index:2}
.hist.show{display:flex}
.hist h2{font-size:18px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
.hist h2 button{border:0;background:var(--key);color:var(--ink);font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;cursor:pointer}
.hi{padding:12px;border-radius:14px;background:var(--key);cursor:pointer;text-align:right}
.hi small{display:block;color:var(--mute);font-size:15px}
.empty{color:var(--mute);text-align:center;margin-top:40px;font-size:15px}
@media(prefers-reduced-motion:reduce){.cur{animation:none}.pad button{transition:none}}
</style></head><body>
<div class="app">
  <div class="top"><button id="hb">История</button><button id="deg">градусы</button></div>
  <div class="disp"><div class="expr" id="expr"></div><div class="res" id="res"></div></div>
  <div class="nav"><button data-a="left" aria-label="Влево">←</button><button data-a="right" aria-label="Вправо">→</button><button data-a="clear">C</button><button data-a="del" aria-label="Стереть">⌫</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="tools" id="tools"></div>
  <div class="pad" id="pad"></div>
  <div class="hist" id="hist"><h2>История <span><button id="hc">Очистить</button> <button id="hx">Закрыть</button></span></h2><div id="hl"></div></div>
</div>
<script>
var FO="\u0001",FS="\u0002",FC="\u0003",PO="\u0004",PC="\u0005",RO="\u0006",RC="\u0007",BO="\u000e",BC="\u000f";
var OPN=FO+PO+RO+BO,CLS=FC+PC+RC+BC,ALLM=/[\u0001-\u0007\u000e\u000f]/g;
var S={e:"",c:0,final:false,deg:true,hist:[],tab:0,res:null};
try{S.hist=JSON.parse(localStorage.getItem("calc-h2")||"[]")}catch(e){}
var TABS=[["Функции",[["e","e"],["ln","ln("],["log","log("],["|x|","abs("],["n!","!"],["π","π"]]],
["Тригон.",[["sin","sin("],["cos","cos("],["tan","tan("],["cot","cot("],["asin","asin("],["acos","acos("]]],
["Анализ",[["lim","lim("],["d/dx","d/dx("],["∫","∫("],["∑","∑("],["∞","∞"],["→","→"]]]];
var B='<i class="b"></i>';
var PAD=[["("+B+")","t","par","g"],["<span>"+B+"<sup>"+B+"</sup></span>","t","pow","g"],["7","n"],["8","n"],["9","n"],["÷","o"],
['<span class="fr">'+B+'<u></u>'+B+'</span>',"t","frac","g"],["√"+B,"t","sqrt","g"],["4","n"],["5","n"],["6","n"],["×","o"],
[B+"<sup>2</sup>","t","sq","g"],["x","t"],["1","n"],["2","n"],["3","n"],["−","o"],
["π","t"],["%","t"],["0","n"],[",","n"],["=","eq","eq"],["+","o"]];
var $=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(s,c){
  var i=0,CUR='<i class="cur"></i>';
  function seq(stop){var out="",has=false,cur=false;
    for(;;){
      if(i===c){out+=CUR;cur=true}
      if(i>=s.length||stop.indexOf(s[i])>-1)break;
      var ch=s[i++];
      if(ch===FO){var a=seq(FS);i++;var d=seq(FC);i++;out+='<span class="fr"><span class="nu">'+a+'</span><span class="de">'+d+'</span></span>';has=true}
      else if(ch===PO){var p=seq(PC);i++;out+="<sup>"+p+"</sup>";has=true}
      else if(ch===RO){var r=seq(RC);i++;out+='<span class="rad">√<span class="ri">'+r+'</span></span>';has=true}
      else if(ch===BO){var q=seq(BC);i++;out+="("+q+")";has=true}
      else{out+=esc(ch);has=true}
    }
    return has?out:'<span class="slot'+(cur?" on":"")+'">'+out+"</span>";}
  return seq("");}
function toJS(s){return s.replace(/\u0001/g,"((").replace(/\u0002/g,")/(").replace(/\u0003/g,"))").replace(/\u0004/g,"**(").replace(/\u0005/g,")").replace(/\u0006/g,"sqrt(").replace(/\u0007/g,")").replace(/\u000e/g,"(").replace(/\u000f/g,")")}
function plain(s){return s.replace(/\u0001/g,"(").replace(/\u0002/g,")/(").replace(/\u0003/g,")").replace(/\u0004/g,"^(").replace(/\u0005/g,")").replace(/\u0006/g,"√(").replace(/\u0007/g,")").replace(/\u000e/g,"(").replace(/\u000f/g,")")}
function evalx(s){
  if(!s.replace(ALLM,"").trim())return null;
  var j=toJS(s),o=(j.match(/\(/g)||[]).length,cl=(j.match(/\)/g)||[]).length;
  j=j+")".repeat(Math.max(0,o-cl));
  j=j.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".").replace(/π/g,"(Math.PI)").replace(/√/g,"sqrt");
  j=j.replace(/(\d+\.?\d*)%/g,"($1/100)").replace(/(\d+)!/g,"F($1)");
  j=j.replace(/(\d|\))\s*(?=[a-zπ(])/g,"$1*").replace(/\)\s*(?=\d)/g,")*");
  var ok=true,m={sin:"sn",cos:"cs",tan:"tn",cot:"ct",asin:"as",acos:"ac",ln:"Math.log",log:"Math.log10",abs:"Math.abs",sqrt:"Math.sqrt",e:"Math.E",F:"F",Math:"Math",PI:"PI",E:"E",log10:"log10"};
  j=j.replace(/[a-zA-Z0-9]+/g,function(w){if(/^\d/.test(w))return w;if(!(w in m)){ok=false;return w}return m[w]});
  if(!ok||/[^0-9a-zA-Z+\-*\/().\s]/.test(j))return undefined;
  var k=S.deg?Math.PI/180:1;
  try{var f=new Function("F","sn","cs","tn","ct","as","ac","return "+j);
    var v=f(function(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r},
      function(x){return Math.sin(x*k)},function(x){return Math.cos(x*k)},function(x){return Math.tan(x*k)},
      function(x){return 1/Math.tan(x*k)},function(x){return Math.asin(x)/k},function(x){return Math.acos(x)/k});
    if(typeof v!=="number"||!isFinite(v))return undefined;
    return Math.abs(v)<1e-12?0:v}catch(e){return undefined}}
function fmt(v){return (+v.toPrecision(12)+"").replace(".",",")}
function draw(){
  $("expr").innerHTML=render(S.e,S.c);
  var v=evalx(S.e);S.res=(v==null||v===undefined)?null:fmt(v);
  var r=$("res");r.className="res"+(S.final?" final":"");
  if(S.res==null)r.textContent="";
  else if(S.final)r.textContent=S.res;
  else r.textContent=/[^\d,]/.test(S.e)?"= "+S.res:"";
  $("deg").textContent=S.deg?"градусы":"радианы"}
function ins(t){S.e=S.e.slice(0,S.c)+t+S.e.slice(S.c);S.c+=t.length}
function fresh(keep){if(S.final){S.e=keep&&S.res?S.res:"";S.c=S.e.length;S.final=false}}
function press(t){
  if(S.final){if(/^[+×÷−]$/.test(t)&&S.res!=null){S.e=S.res}else S.e="";S.c=S.e.length;S.final=false}
  ins(t);draw()}
function tpl(k){
  fresh(k==="frac"||k==="sq"||k==="pow");
  var p=S.c,b=S.e.slice(0,p);
  if(k==="frac"){var m=/[\d,]+$/.exec(b),base=m?m[0]:"";
    S.e=b.slice(0,p-base.length)+FO+base+FS+FC+S.e.slice(p);
    S.c=p-base.length+(base?base.length+2:1)}
  else if(k==="sq"){ins(PO+"2"+PC)}
  else if(k==="pow"){ins(PO+PC);S.c=p+1}
  else if(k==="sqrt"){ins(RO+RC);S.c=p+1}
  else if(k==="par"){ins(BO+BC);S.c=p+1}
  draw()}
function matchEnd(s,i){var d=0;for(var j=i;j<s.length;j++){if(OPN.indexOf(s[j])>-1)d++;else if(CLS.indexOf(s[j])>-1){d--;if(d===0)return j}}return -1}
function del(){
  if(S.final)S.final=false;
  if(S.c>0){var p=S.e[S.c-1];
    if(CLS.indexOf(p)>-1||p===FS)S.c--;
    else if(OPN.indexOf(p)>-1){var end=matchEnd(S.e,S.c-1);
      if(end>-1&&S.e.slice(S.c,end).replace(ALLM,"")===""){S.e=S.e.slice(0,S.c-1)+S.e.slice(end+1);S.c--}else S.c--}
    else{S.e=S.e.slice(0,S.c-1)+S.e.slice(S.c);S.c--}}
  draw()}
function equals(){var v=evalx(S.e);if(v==null)return;
  if(v===undefined){$("res").textContent="Проверьте выражение";return}
  S.hist.unshift([S.e,fmt(v)]);S.hist=S.hist.slice(0,30);try{localStorage.setItem("calc-h2",JSON.stringify(S.hist))}catch(x){}
  S.final=true;draw()}
function act(a){
  if(a==="clear"){S.e="";S.c=0;S.final=false;draw()}
  else if(a==="eq")equals();
  else if(a==="del")del();
  else if(a==="left"){S.final=false;S.c=Math.max(0,S.c-1);draw()}
  else if(a==="right"){S.final=false;S.c=Math.min(S.e.length,S.c+1);draw()}
  else tpl(a)}
function build(){
  $("tabs").innerHTML=TABS.map(function(t,i){return '<button class="'+(i===S.tab?"on":"")+'" data-t="'+i+'">'+t[0]+"</button>"}).join("");
  $("tools").innerHTML=TABS[S.tab][1].map(function(k,i){return '<button data-i="'+i+'">'+k[0]+"</button>"}).join("");
  $("pad").innerHTML=PAD.map(function(k){return '<button class="'+k[1]+(k[3]?" g":"")+'" '+(k[2]?'data-a="'+k[2]+'"':'data-k="'+k[0]+'"')+">"+k[0]+"</button>"}).join("")}
document.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
  var d=b.dataset;
  if(d.t!=null){S.tab=+d.t;build()}
  else if(d.i!=null)press(TABS[S.tab][1][d.i][1]);
  else if(d.a)act(d.a);
  else if(d.k)press(d.k);
  else if(b.id==="deg"){S.deg=!S.deg;draw()}
  else if(b.id==="hb"){renderHist();$("hist").classList.add("show")}
  else if(b.id==="hx")$("hist").classList.remove("show");
  else if(b.id==="hc"){S.hist=[];try{localStorage.removeItem("calc-h2")}catch(x){}renderHist()}});
function renderHist(){$("hl").innerHTML=S.hist.length?S.hist.map(function(h,i){return '<div class="hi" data-h="'+i+'"><small>'+esc(plain(h[0]))+"</small>"+h[1]+"</div>"}).join(""):'<div class="empty">Пока пусто. Вычисленные примеры появятся здесь.</div>'}
$("hl").addEventListener("click",function(ev){var d=ev.target.closest(".hi");if(!d)return;S.e=S.hist[+d.dataset.h][0];S.c=S.e.length;S.final=false;$("hist").classList.remove("show");draw()});
document.addEventListener("keydown",function(ev){var k=ev.key,m={"*":"×","-":"−",".":",","(":"(",")":")","%":"%"};
  if(ev.metaKey||ev.ctrlKey)return;
  if(/^[0-9+]$/.test(k))press(k);
  else if(m[k])press(m[k]);
  else if(k==="/"){ev.preventDefault();tpl("frac")}
  else if(k==="^")tpl("pow");
  else if(k==="Enter"||k==="=")act("eq");
  else if(k==="Backspace")act("del");
  else if(k==="Escape")act("clear");
  else if(k==="ArrowLeft")act("left");
  else if(k==="ArrowRight")act("right")});
build();draw();
</script></body></html>
