<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дискриминант: проверка квадратного уравнения</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#14213d;--muted:#5b6784;--line:#d5dcea;--pos:#0b7f82;--zero:#b26a00;--neg:#b3324f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--card:#16203a;--ink:#e8edf8;--muted:#9aa7c4;--line:#2b3757;--pos:#4fd1c5;--zero:#f0b45a;--neg:#ff7d99}}
:root[data-theme="dark"]{--bg:#0e1524;--card:#16203a;--ink:#e8edf8;--muted:#9aa7c4;--line:#2b3757;--pos:#4fd1c5;--zero:#f0b45a;--neg:#ff7d99}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px}
main{max-width:680px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:500 1.1rem "IBM Plex Mono",monospace}
.eq label{display:flex;align-items:center;gap:6px}
input{width:76px;font:500 1.1rem "IBM Plex Mono",monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
input:focus-visible{outline:2px solid var(--pos);outline-offset:1px}
.calc{font:500 1rem "IBM Plex Mono",monospace;margin:0 0 4px;overflow-x:auto;white-space:nowrap}
.verdict{font-size:1.25rem;font-weight:600;margin:10px 0 2px}
.pos{color:var(--pos)}.zero{color:var(--zero)}.neg{color:var(--neg)}
.roots{font:500 1rem "IBM Plex Mono",monospace;margin:6px 0 0}
.hint{color:var(--muted);margin:0}
svg{display:block;width:100%;height:auto}
.rule{color:var(--muted);font-size:.9rem;margin:0}
</style>
</head>
<body>
<main>
<h1>Дискриминант</h1>
<p class="sub">Введите коэффициенты квадратного уравнения — результат считается сразу.</p>

<section class="card">
<div class="eq">
<label><input id="a" value="1" inputmode="decimal" aria-label="Коэффициент a">x²</label><span>+</span>
<label><input id="b" value="-3" inputmode="decimal" aria-label="Коэффициент b">x</label><span>+</span>
<label><input id="c" value="2" inputmode="decimal" aria-label="Коэффициент c"></label><span>= 0</span>
</div>
</section>

<section class="card" aria-live="polite">
<p class="calc" id="f1"></p>
<p class="calc" id="f2"></p>
<p class="verdict" id="verdict"></p>
<p class="roots" id="roots"></p>
<p class="hint" id="hint"></p>
</section>

<section class="card">
<svg id="g" viewBox="0 0 600 320" role="img" aria-label="График параболы"></svg>
</section>

<p class="rule">D &gt; 0 — два корня, D = 0 — один корень, D &lt; 0 — нет действительных корней.</p>
</main>
<script>
var $=function(id){return document.getElementById(id)};
function f(n){var s=String(parseFloat(n.toFixed(6)));if(s==="-0")s="0";return s.replace("-","−").replace(".",",")}
function par(n){return n<0?"("+f(n)+")":f(n)}
function val(id){var s=$(id).value.trim().replace(",",".").replace("−","-");return s===""||isNaN(Number(s))?NaN:Number(s)}
function clear(){["f1","f2","verdict","roots"].forEach(function(i){$(i).textContent=""});$("g").innerHTML=""}
function update(){
  var a=val("a"),b=val("b"),c=val("c");
  clear();$("hint").textContent="";
  if(isNaN(a)||isNaN(b)||isNaN(c)){$("hint").textContent="Введите числа во все три поля.";return}
  if(a===0){$("hint").textContent="При a = 0 уравнение не квадратное"+(b!==0?": x = "+f(-c/b)+".":".");return}
  var D=b*b-4*a*c;
  $("f1").textContent="D = b² − 4ac";
  $("f2").textContent="D = "+par(b)+"² − 4·"+par(a)+"·"+par(c)+" = "+f(D);
  var v=$("verdict"),r=$("roots"),xv=-b/(2*a);
  if(D>0){var s=Math.sqrt(D),x1=(-b-s)/(2*a),x2=(-b+s)/(2*a);
    v.className="verdict pos";v.textContent="D > 0: два действительных корня";
    r.textContent="x₁ = "+f(Math.min(x1,x2))+",  x₂ = "+f(Math.max(x1,x2));draw(a,b,c,[x1,x2],xv,D)}
  else if(D===0){v.className="verdict zero";v.textContent="D = 0: один корень";
    r.textContent="x = "+f(xv);draw(a,b,c,[xv],xv,D)}
  else{var im=Math.sqrt(-D)/(2*Math.abs(a));v.className="verdict neg";v.textContent="D < 0: действительных корней нет";
    r.textContent="Комплексные: x = "+f(xv)+" ± "+f(im)+"i";draw(a,b,c,[],xv,D)}
}
function draw(a,b,c,roots,xv,D){
  var W=600,H=320,P=24,w=3;
  if(roots.length===2)w=Math.max(3,Math.abs(roots[0]-roots[1])*0.8+1);
  var x0=xv-w,x1=xv+w,N=120,pts=[],ymin=0,ymax=0,i,x,y;
  for(i=0;i<=N;i++){x=x0+(x1-x0)*i/N;y=a*x*x+b*x+c;pts.push([x,y]);ymin=Math.min(ymin,y);ymax=Math.max(ymax,y)}
  var yv=a*xv*xv+b*xv+c;ymin=Math.min(ymin,yv);ymax=Math.max(ymax,yv);
  var pad=(ymax-ymin)*0.1||1;ymin-=pad;ymax+=pad;
  var sx=function(x){return P+(x-x0)/(x1-x0)*(W-2*P)},sy=function(y){return H-P-(y-ymin)/(ymax-ymin)*(H-2*P)};
  var col=D>0?"var(--pos)":D===0?"var(--zero)":"var(--neg)",o="";
  o+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+sy(0)+'" y2="'+sy(0)+'" stroke="var(--muted)" stroke-width="1.5"/>';
  if(x0<=0&&x1>=0)o+='<line x1="'+sx(0)+'" x2="'+sx(0)+'" y1="'+P+'" y2="'+(H-P)+'" stroke="var(--muted)" stroke-width="1.5"/>';
  o+='<polyline fill="none" stroke="'+col+'" stroke-width="3" points="'+pts.map(function(p){return sx(p[0]).toFixed(1)+","+sy(p[1]).toFixed(1)}).join(" ")+'"/>';
  roots.forEach(function(r){o+='<circle cx="'+sx(r)+'" cy="'+sy(0)+'" r="6" fill="var(--card)" stroke="'+col+'" stroke-width="3"/>'});
  o+='<circle cx="'+sx(xv)+'" cy="'+sy(yv)+'" r="4" fill="'+col+'"/>';
  $("g").innerHTML=o;
}
["a","b","c"].forEach(function(id){$(id).addEventListener("input",update)});
update();
</script>
</body>
</html>
